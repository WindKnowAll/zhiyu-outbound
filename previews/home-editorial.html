<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>智语外呼 · 预览 · 暖色编辑稿</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3efe6;
      color: #2a211c;
      font: 18px/1.6 "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif;
    }
    .sheet {
      width: min(1040px, calc(100% - 32px));
      margin: 28px auto;
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 36px;
    }
    .kicker { letter-spacing: 0.22em; font-size: 12px; color: #7a2433; font-family: "PingFang SC", "Noto Sans SC", sans-serif; }
    h1 { margin: 8px 0 12px; font-size: 64px; font-weight: 600; line-height: 0.95; }
    .rule { width: 72px; height: 3px; background: #7a2433; margin: 16px 0; }
    ol { margin: 0; padding-left: 1.2em; }
    button {
      font: inherit;
      border: 0;
      border-bottom: 2px solid #7a2433;
      background: transparent;
      color: #7a2433;
      padding: 0 0 4px;
      cursor: pointer;
    }
    aside {
      background: #fffaf3;
      border-left: 6px solid #7a2433;
      padding: 22px 22px 16px;
    }
    h2 { margin: 0 0 8px; font-size: 28px; }
    label { display: block; margin-top: 12px; font-size: 15px; font-family: "PingFang SC", "Noto Sans SC", sans-serif; }
    textarea, input[type="file"] { width: 100%; margin-top: 6px; font: 16px/1.5 "PingFang SC", "Noto Sans SC", sans-serif; }
    textarea { border: 0; border-bottom: 1px solid #d9c7b8; background: transparent; min-height: 96px; }
    #demo { font-family: "PingFang SC", "Noto Sans SC", sans-serif; font-size: 14px; color: #7a2433; }
    #demo:empty { display: none; }
    @media (max-width: 800px) {
      .sheet { grid-template-columns: 1fr; gap: 18px; margin: 16px auto; }
      h1 { font-size: 42px; }
    }
  </style>
</head>
<body>
  <article class="sheet">
    <header>
      <p class="kicker">竞赛模拟 · 不是京东官方</p>
      <h1>智语<br />外呼</h1>
      <div class="rule"></div>
      <p>这一页是暖色编辑稿预览，不是正在使用的语音首页。对象是合成商家，不是消费者。</p>
      <p>模拟商家：甲乙合成商贸有限公司。模拟店铺：甲乙合成旗舰店。</p>
      <ol>
        <li>模拟场景：品牌方明确告知假授权</li>
        <li>先确认身份，再谈驳回</li>
        <li>空话术不编原因</li>
      </ol>
      <p><button type="button" id="go">开始这通模拟通话</button></p>
      <p id="demo"></p>
    </header>
    <aside>
      <h2>异常情况</h2>
      <p>下面就是要填的正文和可选图片。点提交不会发到服务器，也不会生成工单。</p>
      <form id="sheet">
        <label>具体情况
          <textarea placeholder="写给评审看的静态句子"></textarea>
        </label>
        <label>图片，可选，不会上传
          <input type="file" />
        </label>
        <p><button type="submit">记下这则异常</button></p>
      </form>
    </aside>
  </article>
  <script>
    document.getElementById("go").addEventListener("click", function () {
      document.getElementById("demo").textContent = "静态演示：没有申请麦克风，没有开始通话。";
    });
    document.getElementById("sheet").addEventListener("submit", function (event) {
      event.preventDefault();
      document.getElementById("demo").textContent = "静态演示：没有提交，没有上传图片。";
    });
  </script>
</body>
</html>

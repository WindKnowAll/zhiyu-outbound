<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>智语外呼 · 预览 · 蓝灰工作台</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #e8eef5;
      color: #1c2836;
      font: 14px/1.45 "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    }
    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: #f7f9fc;
      border-bottom: 1px solid #d5deea;
    }
    .brand { font-weight: 700; letter-spacing: -0.02em; }
    .tag { color: #3d5168; font-size: 12px; }
    .pill {
      padding: 4px 8px;
      border-radius: 999px;
      background: #e7eef8;
      color: #1d4e89;
      font-size: 12px;
    }
    main { padding: 12px; display: grid; grid-template-columns: 1.1fr 0.8fr 1fr; gap: 12px; }
    section {
      background: #fff;
      border: 1px solid #d5deea;
      border-radius: 8px;
      padding: 12px;
    }
    h1 { margin: 0; font-size: 16px; }
    h2 { margin: 0 0 8px; font-size: 13px; color: #3d5168; font-weight: 600; }
    .row { display: flex; justify-content: space-between; gap: 8px; padding: 8px; border: 1px solid #e1e8f0; border-radius: 6px; margin-bottom: 6px; }
    .row strong { font-weight: 600; }
    button, select, textarea, input[type="file"] { font: inherit; }
    button {
      border: 0;
      border-radius: 6px;
      padding: 8px 10px;
      background: #1d4e89;
      color: #fff;
      cursor: pointer;
    }
    button.ghost { background: #e7eef8; color: #1d4e89; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .metric { font-size: 28px; font-weight: 700; letter-spacing: -0.04em; margin: 8px 0; }
    label { display: grid; gap: 4px; margin-top: 8px; font-size: 12px; color: #3d5168; }
    textarea, select { width: 100%; border: 1px solid #d5deea; border-radius: 6px; padding: 8px; background: #fff; color: inherit; }
    .note { margin: 8px 0 0; color: #3d5168; font-size: 12px; }
    #demo { margin: 8px 12px 0; padding: 8px 10px; background: #fff4e8; color: #6a3b12; border-radius: 6px; }
    #demo:empty { display: none; }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
      .bar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <div>
      <div class="brand">智语外呼</div>
      <div class="tag">竞赛模拟 · 不是京东官方服务 · 静态预览，不是正在使用的首页</div>
    </div>
    <div class="pill">模拟数据 · 未接通</div>
  </header>
  <p id="demo"></p>
  <main>
    <section>
      <h2>场景</h2>
      <div class="row"><span>品牌 / 授权书-验真</span><strong>模拟</strong></div>
      <div class="row"><span>品牌方明确告知假授权</span><strong>第 27 行样例</strong></div>
      <label>切换样例
        <select id="scene">
          <option>模拟 · 品牌方明确告知假授权</option>
          <option>模拟 · 图形商标</option>
          <option>模拟 · 话术为空</option>
        </select>
      </label>
      <div class="actions">
        <button type="button" id="go">开始通话</button>
        <button type="button" class="ghost" id="hold">文字调试</button>
      </div>
      <p class="note">按钮只在这页里写一句说明，不申请麦克风，不连接模型。</p>
    </section>
    <section>
      <h2>状态</h2>
      <div class="metric">待命</div>
      <p class="note">合成商家：甲乙合成商贸有限公司。店铺：甲乙合成旗舰店。这两项是模拟数据。</p>
      <p class="note">身份确认前不说驳回细节。本预览没有真实通话记录。</p>
    </section>
    <section>
      <h1>异常情况提交</h1>
      <p class="note">主字段在下面。这张表不会发到服务器。</p>
      <form id="sheet">
        <label>具体情况
          <textarea rows="4" placeholder="模拟：写一句异常，不会提交"></textarea>
        </label>
        <label>图片（可选，演示用，不上传）
          <input type="file" />
        </label>
        <div class="actions"><button type="submit">提交</button></div>
      </form>
    </section>
  </main>
  <script>
    function say(text) { document.getElementById("demo").textContent = text; }
    document.getElementById("go").addEventListener("click", function () {
      say("静态演示：没有申请麦克风，也没有开始通话。");
    });
    document.getElementById("hold").addEventListener("click", function () {
      say("静态演示：这里不是文字调试页，不会打开 /debug。");
    });
    document.getElementById("sheet").addEventListener("submit", function (event) {
      event.preventDefault();
      say("静态演示：没有提交工单，也没有上传图片。");
    });
  </script>
</body>
</html>

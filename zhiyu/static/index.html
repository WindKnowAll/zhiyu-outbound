<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>智语外呼</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="phone">
      <header>
        <p class="eyebrow">2026 智语外呼 · 比赛模拟</p>
        <h1>商家资质审核驳回</h1>
        <p class="lead">这不是京东真实业务。对方是合成的脱敏商家，不是消费者。接通后先确认公司和店铺，确认前不说驳回细节。说话时可以直接插话。</p>
      </header>

      <p id="banner" class="banner" hidden></p>

      <section class="call" aria-live="polite">
        <div id="orb" class="orb quiet"></div>
        <p id="status" class="status">正在检查配置</p>
        <button id="call" type="button" disabled>开始通话</button>
        <audio id="remote" autoplay playsinline></audio>
      </section>

      <section class="transcript" aria-label="对话记录">
        <h2>通话记录</h2>
        <ol id="lines"></ol>
      </section>

      <section class="latency" aria-label="本轮耗时">
        <h2>本轮耗时</h2>
        <dl id="latency">
          <div><dt>ASR 定稿</dt><dd id="m-asr">—</dd></div>
          <div><dt>LLM 首 token</dt><dd id="m-llm">—</dd></div>
          <div><dt>TTS 首包</dt><dd id="m-tts">—</dd></div>
          <div><dt>端到端首包</dt><dd id="m-e2e">—</dd></div>
        </dl>
      </section>

      <section class="transcript" aria-label="模拟工单">
        <h2>本通模拟工单</h2>
        <p id="ticket">还没有写回。这是本项目的本地记录，不是京东官方接口。</p>
      </section>

      <footer>
        <p>比赛模拟。不索要验证码、密码、银行卡或身份证，也不保证审核通过。</p>
      </footer>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
